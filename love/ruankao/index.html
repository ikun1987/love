<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知心的软考背诵本 · 软件设计师知识点整理</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<style>
:root{
  --bg:#fdf6ee; --bg2:#fffaf3; --card:#fffdfa;
  --ink:#4a3b32; --ink-soft:#8a7466; --line:#e8d9c9;
  --accent:#e2607a; --accent-soft:#fbe3ea;
  --gold:#e8a33d; --gold-soft:#fdf1da;
  --green:#3fa97b; --green-soft:#e3f4ec;
  --radius:18px;
  --shadow:0 4px 20px rgba(160,110,70,.10);
  --shadow-hover:0 10px 30px rgba(160,110,70,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(900px 500px at 12% -6%, #ffe9d6 0%, transparent 55%),
    radial-gradient(900px 600px at 105% 8%, #ffe0e8 0%, transparent 50%),
    linear-gradient(var(--bg), var(--bg2));
  background-attachment:fixed;
  min-height:100vh;
  line-height:1.75;
}
::selection{background:var(--accent-soft)}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.hearts span{position:absolute;bottom:-8vh;opacity:0;animation:floatUp linear infinite;filter:blur(.3px)}
@keyframes floatUp{
  0%{transform:translateY(0) scale(.6) rotate(0deg);opacity:0}
  12%{opacity:.5}
  85%{opacity:.35}
  100%{transform:translateY(-115vh) scale(1) rotate(18deg);opacity:0}
}
.wrap{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding:26px 18px 90px}
header.hero{
  text-align:center;padding:44px 22px 30px;margin-bottom:26px;
  background:linear-gradient(160deg,#fff 0%,#fff6ec 100%);
  border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);
  position:relative;overflow:hidden;
}
header.hero::before,header.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(2px);opacity:.5}
header.hero::before{width:180px;height:180px;background:#ffd9e3;top:-70px;left:-50px}
header.hero::after{width:200px;height:200px;background:#ffe7c8;bottom:-90px;right:-60px}
.hero-inner{position:relative;z-index:2}
.hero h1{font-size:clamp(26px,5vw,40px);letter-spacing:1px}
.hero h1 .grad{background:linear-gradient(90deg,var(--accent),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{margin-top:10px;color:var(--ink-soft);font-size:15px}
.badges{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}
.badge{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:13.5px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(160,110,70,.06)}
.badge b{color:var(--accent);font-size:16px}
.badge.hot{background:var(--accent-soft);border-color:#f3c3d1;color:#b03a55}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px}
.btn{cursor:pointer;border:none;border-radius:14px;font-size:14.5px;font-weight:600;padding:11px 20px;transition:.2s;box-shadow:0 3px 10px rgba(160,110,70,.10);display:inline-flex;align-items:center;gap:7px;font-family:inherit}
.btn:active{transform:translateY(1px) scale(.98)}
.btn-accent{background:linear-gradient(135deg,var(--accent),#ef8aa0);color:#fff}
.btn-accent:hover{box-shadow:0 6px 18px rgba(226,96,122,.4)}
.btn-soft{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn-soft:hover{box-shadow:var(--shadow-hover)}
.btn.on{background:linear-gradient(135deg,var(--gold),#f2c069);color:#fff}
.search{margin:0 auto 26px;max-width:520px;position:relative}
.search input{width:100%;padding:13px 20px 13px 46px;font-size:15px;border-radius:999px;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow);outline:none;font-family:inherit;color:var(--ink);transition:.2s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.search .icon{position:absolute;left:17px;top:50%;transform:translateY(-50%);font-size:17px;opacity:.6}
nav.toc{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-bottom:34px}
nav.toc a{text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 15px;font-size:13.8px;font-weight:600;transition:.2s;box-shadow:0 2px 8px rgba(160,110,70,.06)}
nav.toc a:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
nav.toc a .n{display:inline-block;min-width:20px;text-align:center;background:var(--accent-soft);color:var(--accent);border-radius:7px;font-size:12px;margin-left:6px;padding:0 5px}
section.group{margin-bottom:36px}
.group-head{display:flex;align-items:center;gap:12px;margin:0 4px 16px}
.group-head .emoji{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:23px;background:linear-gradient(135deg,#fff,#ffeeda);border:1px solid var(--line);box-shadow:var(--shadow)}
.group-head h2{font-size:21px;letter-spacing:.5px}
.group-head .cnt{font-size:12.5px;color:var(--ink-soft);background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 11px}
.group-head .line{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px 16px;margin-bottom:14px;box-shadow:var(--shadow);transition:.2s;position:relative}
.card:hover{box-shadow:var(--shadow-hover)}
.q-top{display:flex;align-items:flex-start;gap:10px}
.q-num{flex:none;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:3px 8px;margin-top:3px;min-width:34px;text-align:center}
.q-text{flex:1;font-size:15.5px}
.q-actions{display:flex;gap:6px;flex:none;margin-top:2px}
.mini{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:12px;padding:4px 9px;color:var(--ink-soft);transition:.15s;font-family:inherit}
.mini:hover{border-color:var(--gold);color:var(--gold)}
.mini.recite.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.blank{display:inline;position:relative;font-weight:700;color:#c2435f;padding:0 5px;white-space:pre-wrap;border-bottom:2px solid var(--accent);background:linear-gradient(180deg,transparent 62%,#ffe1ea 62%);transition:.2s;border-radius:3px}
.blank:hover{background:linear-gradient(180deg,transparent 50%,#ffd3e0 50%)}
body.recite .blank{color:transparent;background:linear-gradient(180deg,transparent 62%,#f3e6da 62%)}
body.recite .blank:hover{color:#c2435f}
.card.hidden-by-me .blank{color:transparent;background:linear-gradient(180deg,transparent 62%,#f3e6da 62%)}
.card.hidden-by-me .blank:hover{color:#c2435f}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:11px 0 0 44px}
.tag{font-size:11.5px;color:var(--ink-soft);background:#f7efe6;border-radius:7px;padding:2px 9px}
.ansline{margin:10px 0 0 44px;font-size:13px;color:var(--ink-soft);border-left:3px solid var(--line);padding-left:10px}
.ansline .ok{color:var(--green);font-weight:700}
details.ref{margin:11px 0 0 44px;font-size:13.5px;color:var(--ink-soft)}
details.ref summary{cursor:pointer;color:var(--gold);font-weight:600;font-size:13.5px;list-style:none;display:inline-flex;align-items:center;gap:5px}
details.ref summary::before{content:"💡"}
details.ref summary::-webkit-details-marker{display:none}
details.ref[open] summary{margin-bottom:5px}
details.ref .ref-body{background:var(--gold-soft);border-radius:11px;padding:10px 14px;margin-top:6px;border:1px dashed #ecc98f}
mark.hl{background:linear-gradient(180deg,transparent 40%,#ffe08a 40%);color:inherit;border-radius:2px;padding:0 1px}
mark.hl.pink{background:linear-gradient(180deg,transparent 40%,#ffc0d4 40%)}
mark.hl.green{background:linear-gradient(180deg,transparent 40%,#b8ecd4 40%)}
footer{text-align:center;color:var(--ink-soft);font-size:13px;margin-top:50px;line-height:2}
footer .heart{color:var(--accent)}
.fab-top{position:fixed;right:20px;bottom:24px;z-index:50;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#ef8aa0);color:#fff;border:none;font-size:20px;cursor:pointer;box-shadow:0 6px 18px rgba(226,96,122,.45);transition:.2s;display:grid;place-items:center}
.fab-top:hover{transform:translateY(-3px)}
.empty{display:none;text-align:center;color:var(--ink-soft);padding:60px 0;font-size:15px}
.modal{position:fixed;inset:0;background:rgba(60,40,30,.4);display:none;place-items:center;z-index:99;backdrop-filter:blur(3px)}
.modal.show{display:grid}
.modal .box{background:#fff;border-radius:22px;padding:28px 26px;max-width:460px;width:92%;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:80vh;overflow:auto}
.modal h3{font-size:18px;margin-bottom:6px}
.modal .tip{font-size:13px;color:var(--ink-soft);margin-bottom:14px}
.check-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.day{aspect-ratio:1;border-radius:11px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--ink-soft);cursor:pointer;transition:.15s;background:#fff;user-select:none}
.day:hover{border-color:var(--accent)}
.day.done{background:linear-gradient(135deg,var(--accent),#ef8aa0);color:#fff;border-color:transparent;font-weight:700}
.day.today{outline:2px solid var(--gold);outline-offset:1px}
.legend{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12.5px;color:var(--ink-soft)}
@media (max-width:640px){
  .q-actions{flex-direction:column}
  .tags,.ansline,details.ref{margin-left:0}
  .q-num{min-width:28px}
}
</style>
</head>
<body>

<div class="hearts" id="hearts" aria-hidden="true"></div>

<div class="wrap">
  <header class="hero">
    <div class="hero-inner">
      <h1>📖 知心的<span class="grad">软考背诵本</span></h1>
      <p class="sub">软件设计师全面知识库 · 截图真题 + 考点精炼 + 三色笔记 + 英语题全面整理，查漏补缺专用 💪</p>
      <div class="badges">
        <span class="badge hot">⏳ 距离考试（<span id="examDate">2026-10-24</span>）还有 <b id="dDay">--</b> 天</span>
        <span class="badge">📝 共 <b id="totalQ">0</b> 条知识点</span>
        <span class="badge">📚 <b id="totalG">0</b> 个板块</span>
      </div>
      <div class="toolbar">
        <button class="btn btn-accent" id="btnRecite">🙈 背诵模式：关</button>
        <button class="btn btn-soft" id="btnExpand">📖 全部展开解析</button>
        <button class="btn btn-soft" id="btnCheck">📅 今日打卡</button>
      </div>
    </div>
  </header>

  <div class="search">
    <span class="icon">🔍</span>
    <input id="search" type="text" placeholder="搜索知识点，比如：关键路径 / 设计模式 / 补码 / 分治 …">
  </div>

  <nav class="toc" id="toc"></nav>
  <main id="content"></main>
  <div class="empty" id="empty">没有找到匹配的知识点，换个关键词试试～</div>

  <footer>
    <div>给坤的专属复习资料 · 考点都在横线上，多看几遍就记住啦</div>
    <div>Made with <span class="heart">❤</span> by 知心 · 祝坤 10.24 软考一次过！🎓</div>
  </footer>
</div>

<div class="modal" id="checkModal">
  <div class="box">
    <h3>📅 每日背诵打卡</h3>
    <p class="tip">点击格子打卡 / 取消，金圈是今天。坚持到考试那天，你就赢了 ✨</p>
    <div class="check-grid" id="checkGrid"></div>
    <div class="legend">
      <span>已打卡 <b id="doneCount">0</b> 天</span>
      <button class="btn btn-soft" style="padding:7px 16px;font-size:13px" id="btnCloseModal">关闭</button>
    </div>
  </div>
</div>

<button class="fab-top" id="fabTop" title="回到顶部">↑</button>

<script>
/* 内容数据：q=填好答案的陈述句，⟦答案⟧渲染为带横线样式；b=背诵模式遮住的词；ref=参考解析 */
window.EXAM_DATE='2026-10-24';
window.DATA=[
{ id:'g1', name:'计算机组成原理', icon:'🖥️', questions:[
  { q:'对于定点纯小数的数据编码，只有 ⟦补码⟧ 能表示 -1（原码和反码都不能表示 -1）。',
    b:['补码'], tags:['码制'], ref:'定点纯小数：原码、反码的表示范围都达不到 -1，只有补码能表示 -1。' },
  { q:'CPU 中各寄存器的作用：⟦指令寄存器⟧ 存储即将执行的指令；⟦状态条件寄存器⟧ 存状态标志与控制标志；⟦程序计数器⟧ 存储下一条要执行指令的地址；⟦主存地址寄存器⟧ 保存当前 CPU 访问内存单元的地址。',
    b:['指令寄存器','状态条件寄存器','程序计数器','主存地址寄存器'], tags:['CPU','寄存器'], ref:'本题考查 CPU 组成，四个寄存器分工要分清。' },
  { q:'硬盘所属的存储类别是 ⟦辅存⟧。层次化存储体系：CPU 对应 ⟦寄存器⟧，Cache 对应 ⟦缓存⟧，主存对应 ⟦DRAM⟧，辅存对应 ⟦硬盘、光盘⟧ 等。',
    b:['辅存','寄存器','缓存','DRAM','硬盘、光盘'], tags:['存储体系'], ref:'由快到慢、由贵到便宜：寄存器→缓存→主存→辅存。' },
  { q:'若浮点数尾数用补码表示，则判断运算结果是否为规格化的方法是：⟦数符与尾数小数点后第一位数字相异⟧ 为规格化表示。',
    b:['数符与尾数小数点后第一位数字相异'], tags:['浮点数','规格化'], ref:'补码尾数规格化：符号位与最高数值位相反（相异）才是规格化。' },
  { q:'CRC 循环冗余校验码的编码方法是：在 ⟦k 位信息位之后拼接 r 位校验位⟧；奇偶校验码是由若干位有效信息（如一个字节）再加上 ⟦一个二进制位（校验位）⟧ 组成。',
    b:['k 位信息位之后拼接 r 位校验位','一个二进制位（校验位）'], tags:['校验码'], ref:'本题考查校验码基础：CRC 是"信息位后拼接校验位"，奇偶校验是"加一位校验位"。' },
  { q:'计算机中实现算术逻辑运算的 ALU，其加法器采用 ⟦补码运算的二进制加法器⟧。',
    b:['补码运算的二进制加法器'], tags:['运算器'], ref:'计算机统一用补码进行加减运算，减法也转化为补码加法。' },
  { q:'某系统由两个可靠性为 R 的部件并联后再与两个可靠性为 R 的部件串联，其可靠度为 ⟦R·(1-(1-R)²)·R⟧。',
    b:['R·(1-(1-R)²)·R'], tags:['可靠性'], ref:'串联相乘、并联 1-(1-R)ⁿ；中间两部件并联得 1-(1-R)²，再与两端串联相乘。' },
  { q:'海明码利用奇偶性来检错和纠错：设数据位 n 位、校验位 k 位，须满足 ⟦2^k ≥ n+k+1⟧，且校验位必须位于 ⟦2^n 位置⟧（第 1、2、4、8、16…位）。',
    b:['2^k ≥ n+k+1','2^n 位置'], tags:['校验码','海明码'], ref:'海明码可纠错；CRC 由信息码+校验码组成，奇偶校验只能检错。' },
  { q:'按指令流-数据流组织方式（Flynn 分类法），计算机分为 ⟦SISD 单指令流单数据流⟧、⟦SIMD 单指令流多数据流⟧、⟦MISD 多指令流单数据流⟧、⟦MIMD 多指令流多数据流⟧ 四类。',
    b:['SISD 单指令流单数据流','SIMD 单指令流多数据流','MISD 多指令流单数据流','MIMD 多指令流多数据流'], tags:['体系结构','Flynn'], ref:'阵列处理机是 SIMD；多处理机系统是 MIMD。' },
  { q:'n 条指令采用流水方式执行的时间公式为 ⟦(t1+t2+…+tk)+(n-1)Δt⟧；流水线周期取 ⟦指令中执行时间最长的一段⟧；流水线技术最适合 ⟦RISC（指令长度固定、单周期执行）⟧。',
    b:['(t1+t2+…+tk)+(n-1)Δt','指令中执行时间最长的一段','RISC（指令长度固定、单周期执行）'], tags:['流水线'], ref:'例：取指 5Δt、分析 2Δt、执行 3Δt，执行 500 条 = (5+2+3)Δt + 499×5Δt = 2505Δt。' },
  { q:'Cache 地址映像方式中，块冲突次数最小、位置最灵活的是 ⟦全相联映像⟧（缺点是变换复杂、速度慢）；地址变换最简单但块冲突率高的是 ⟦直接映像⟧；利用率较高的是 ⟦组相联映像⟧。',
    b:['全相联映像','直接映像','组相联映像'], tags:['Cache','存储'], ref:'Cache 用于解决 CPU 与主存速度不匹配，避免 CPU“空等”。' },
  { q:'I/O 系统的 5 种工作方式按 CPU 干预程度从多到少排列：⟦程序控制（查询）方式⟧ → ⟦程序中断方式⟧ → ⟦DMA 方式⟧ → ⟦通道方式⟧ → ⟦I/O 处理机⟧；其中 ⟦DMA⟧ 允许主存与 I/O 设备直接进行批量数据交换，仅在传输开始和结束时需要 CPU 干预。',
    b:['程序控制（查询）方式','程序中断方式','DMA 方式','通道方式','I/O 处理机','DMA'], tags:['I/O'], ref:'中断方式下 CPU 与 I/O 可并行；DMA 适合高速批量数据传输。' },
  { q:'按功能划分，总线分为 ⟦地址总线、数据总线、控制总线⟧ 三类。',
    b:['地址总线、数据总线、控制总线'], tags:['总线'], ref:'地址总线单向传输地址；数据总线双向传输数据；控制总线传输控制信号。' },

  { q:"CPU 由 ⟦运算器⟧ 和 ⟦控制器⟧ 两个部件组成（不含存储器）。运算器包含：算术逻辑单元 ⟦ALU⟧（算术/逻辑运算）、累加寄存器 ⟦AC⟧（暂存数据、为 ALU 提供工作区）、数据缓冲寄存器 ⟦DR⟧（写内存时暂存指令或数据）、状态条件寄存器 ⟦PSW⟧（存状态标志与控制标志）；控制器包含：程序计数器 ⟦PC⟧（存下一条要执行指令的地址）、指令寄存器 ⟦IR⟧（存即将执行的指令）、指令译码器 ⟦ID⟧（分析解释操作码）、地址寄存器 ⟦AR⟧（保存当前访问的内存单元地址）和时序部件。",
    b:["运算器", "控制器", "ALU", "AC", "DR", "PSW", "PC", "IR", "ID", "AR"], tags:["CPU组成", "寄存器"], ref:"记忆：运算器管“算”（ALU/AC/DR/PSW），控制器管“控”（PC/IR/ID/AR/时序）。累加器AC常考“算术运算结果暂存在AC”。" },
  { q:"复杂指令系统 ⟦CISC⟧：指令数量多（100~250条）、使用频率相差悬殊（20%的简单指令占80%出现频率）、寻址方式多（5~20种）、指令长度⟦变长⟧、可对主存单元数据直接处理、以⟦微程序控制⟧为主。精简指令系统 ⟦RISC⟧：指令数量少、只有 ⟦LOAD/STORE⟧ 两条指令操作存储器、寻址方式少、指令长度⟦固定⟧、以⟦硬布线逻辑控制⟧为主、⟦单周期⟧指令执行并采用流水线技术、通用寄存器数量多（32个以上）、采用优化的编译器。",
    b:["CISC", "变长", "微程序控制", "RISC", "LOAD/STORE", "固定", "硬布线逻辑控制", "单周期"], tags:["指令系统", "RISC", "CISC"], ref:"RISC 更适合流水线；考试常考两者特点对比。" },
  { q:"内存编址与总线：计算机一次处理 n 位数据，则 ⟦数据总线⟧ 的长度为 n（字长=数据总线位数）；需要 n 位二进制表示所有地址，则 ⟦地址总线⟧ 的个数为 n。内存容量 ⟦= 每个芯片容量 × 芯片个数⟧，每个芯片容量 ⟦= 一个地址代表的容量 × 编址总数⟧。例：按字节编址 A4000H~CBFFFH，共 CBFFFH−A4000H+1=28000H=⟦160K⟧ 字节，用 32K×8bit 芯片构成需 160K/32K=⟦5⟧ 片。",
    b:["数据总线", "地址总线", "= 每个芯片容量 × 芯片个数", "= 一个地址代表的容量 × 编址总数", "160K", "5"], tags:["内存编址", "总线"], ref:"十六进制减法再转二进制数位数：28000H=2^19+…，记住常用结论 28000H=160K。" },
  { q:"流水线性能度量：最大吞吐率 TP⟦max=1/Δt⟧（Δt 为流水线周期）；加速比 S=⟦不使用流水线的执行时间 ÷ 使用流水线的执行时间⟧；要使加速比和效率最大化，应对流水线各级采用 ⟦相同的运行时间⟧；流水线出现断流，加速比会明显下降。若各段时间不等，实际吞吐率取决于 ⟦最慢的一段⟧。",
    b:["max=1/Δt", "不使用流水线的执行时间 ÷ 使用流水线的执行时间", "相同的运行时间", "最慢的一段"], tags:["流水线"], ref:"异步流动控制复杂且可能引入不可预知的相关，并不会明显提高性能。" },
  { q:"磁盘调度算法：⟦先来先服务（FCFS）⟧ 按请求访问的先后次序调度；⟦最短寻道时间优先（SSTF）⟧ 访问与当前磁头距离最近的磁道（可能导致“饥饿”）；⟦单向扫描调度算法⟧ 磁头只沿一个方向单向移动。",
    b:["先来先服务（FCFS）", "最短寻道时间优先（SSTF）", "单向扫描调度算法"], tags:["磁盘调度", "操作系统"], ref:"SSTF 平均寻道时间较短但可能饿死远端请求；SCAN（电梯算法）是双向扫描。" },
  { q:"系统可靠性：串联系统 R=⟦R1×R2×…×Rn⟧（一个失效则整体失效）；并联系统 R=⟦1−(1−R1)(1−R2)…(1−Rn)⟧（全部失效才失效）；N 模冗余（表决）通常用于提高可靠性。",
    b:["R1×R2×…×Rn", "1−(1−R1)(1−R2)…(1−Rn)"], tags:["可靠性"], ref:"串联越串越不可靠，并联越并越可靠。" },

]},
{ id:'g2', name:'数据结构与算法基础', icon:'🧮', questions:[
  { q:'根据树的性质计算可得 ⟦x = 38⟧（本题考查树的性质，利用结点数与度数的关系列方程求解）。',
    b:['x = 38'], tags:['树'], ref:'树的性质：总结点数 = 各度数结点数之和，边数 = 结点数 - 1。' },
  { q:'某工程网络图共有 ⟦4⟧ 条关键路径，关键路径总长度为 ⟦55⟧。',
    b:['4','55'], tags:['关键路径'], ref:'解析：分别有 4 条这样的关键路径，总长度为 55。' },
  { q:'一个软件项目的活动图（顶点表示里程碑、边上的数字表示完成该活动所需天数）中，关键路径是 ⟦时间最长⟧ 的路径，其关键路径长度为 ⟦58⟧；活动 ⟦C→F⟧ 一旦延期就会影响项目的进度。',
    b:['时间最长','58','C→F'], tags:['关键路径','项目管理'], ref:'2022下半年真题：关键路径长度选 D(58)，延期影响进度的活动选 B(C→F)。' },
  { q:'若某图的邻接表中表示边的表结点有 ⟦奇数个⟧，则该图 G 是 ⟦有向图⟧。',
    b:['奇数个','有向图'], tags:['图','邻接表'], ref:'无向图每条边在两个顶点各出现一次，边表结点必为偶数；奇数个说明是有向图。' },
  { q:'线性表采用链式存储结构的特点是：插入和删除操作 ⟦不需要移动元素⟧，且 ⟦无须事先估计存储空间大小⟧。',
    b:['不需要移动元素','无须事先估计存储空间大小'], tags:['线性表','链式存储'], ref:'注意："所需空间大小与表长成正比"不是链式存储特有的优点（顺序表也一样），是干扰项。' },
  { q:'归并排序算法采用了 ⟦分治⟧ 算法设计策略；归并排序没有好坏之分，其最好、最坏、平均情况下的时间复杂度都是 ⟦O(nlog₂n)⟧。',
    b:['分治','O(nlog₂n)'], tags:['排序','分治'], ref:'归并排序无论数据初始状态如何，时间复杂度都是 O(nlogn)。' },
  { q:'在有序数组中实现折半（二分）查找的时间复杂度是 ⟦O(log₂n)⟧；利用大小顶堆实现排序，每次重建堆的时间复杂度是 log₂n，n 个元素总的时间复杂度是 ⟦O(nlog₂n)⟧。',
    b:['O(log₂n)','O(nlog₂n)'], tags:['算法效率'], ref:'折半查找 search(array,n,v) 找不到返回 -1；堆排序每次重建堆 log₂n，共 n 次。' },
  { q:'判断是否包含指定子序列、LCS 最长公共子序列、钢管切割问题，若用动态规划法 ⟦自顶向下⟧ 求解，时间复杂度为 ⟦O(2ⁿ)⟧。',
    b:['自顶向下','O(2ⁿ)'], tags:['算法效率','动态规划'], ref:'自顶向下（带备忘录的递归）若不优化会指数级膨胀 O(2ⁿ)。' },
  { q:'常见时间复杂度由小到大（增长速度）的关系是：⟦对数 < 多项式（指数越小增长越慢）< 指数函数 < 阶乘⟧，即 lgn < n < n² < 2ⁿ < n!，重点理解记忆倒数三个。',
    b:['对数 < 多项式（指数越小增长越慢）< 指数函数 < 阶乘'], tags:['算法效率','渐进复杂度'], ref:'宝宝专属笔记：常数系数（如 1000n 的 1000）在渐进分析里直接忽略。' },
  { q:'采用贪心算法能够保证求得最优解的问题是 ⟦部分（分数）背包⟧ 问题。',
    b:['部分（分数）背包'], tags:['贪心','背包'], ref:'0-1背包、矩阵链乘、最长公共子序列要用动态规划；只有部分(分数)背包用贪心可得最优。' },
  { q:'在数据结构中，矩阵通常用 ⟦二维数组⟧ 来存储（本题考查矩阵与数组的存储结构）。',
    b:['二维数组'], tags:['矩阵','数组'], ref:'特殊矩阵（对称矩阵、三角矩阵、稀疏矩阵）常压缩存储到一维数组以节省空间。' },
  { q:'求最小生成树时，⟦普里姆（Prim）算法⟧ 从给定顶点出发不断扩展最短邻接边，适合 ⟦边稠密⟧ 的图；⟦克鲁斯卡尔（Kruskal）算法⟧ 按边权从小到大全局选边且不成环，适合 ⟦边稀疏⟧ 的图。',
    b:['普里姆（Prim）算法','边稠密','克鲁斯卡尔（Kruskal）算法','边稀疏'], tags:['图','最小生成树'], ref:'Prim 抓点扩树，Kruskal 抓边排序；两者都是贪心策略。' },
  { q:'线性表顺序存储的优点是 ⟦可以随机存取表中元素⟧，缺点是插入删除要移动元素；链式存储的优点是 ⟦插入删除不需要移动元素⟧，缺点是不能随机访问。',
    b:['可以随机存取表中元素','插入删除不需要移动元素'], tags:['线性表'], ref:'顺序存储逻辑相邻物理也相邻；链式存储靠指针链接。' },
  { q:'顺序查找的平均查找长度为 ⟦(n+1)/2⟧；二分（折半）查找的前提是 ⟦元素有序⟧，每比较一次查找范围 ⟦减半⟧。',
    b:['(n+1)/2','元素有序','减半'], tags:['查找'], ref:'二分查找时间复杂度 O(log₂n)；顺序查找 O(n)。' },
  { q:'排序算法时间复杂度速记：直接插入 ⟦最好 O(n)、最坏 O(n²)⟧；冒泡 ⟦O(n²)⟧；简单选择 ⟦O(n²)⟧；希尔 ⟦O(n^1.3)⟧；快速 ⟦最好 O(nlog₂n)、基本有序时最坏 O(n²)⟧；堆排序与归并排序 ⟦O(nlog₂n)⟧。',
    b:['最好 O(n)、最坏 O(n²)','O(n²)','O(n²)','O(n^1.3)','最好 O(nlog₂n)、基本有序时最坏 O(n²)','O(nlog₂n)'], tags:['排序'], ref:'堆的定义：大顶堆 Ki≥K2i 且 Ki≥K2i+1；小顶堆相反。' },
  { q:'堆排序中：Ki≤K2i 且 Ki≤K2i+1 称为 ⟦小顶堆⟧；Ki≥K2i 且 Ki≥K2i+1 称为 ⟦大顶堆⟧（其中 2i、2i+1 不大于 n）。',
    b:['小顶堆','大顶堆'], tags:['排序','堆'], ref:'大顶堆每次输出堆顶最大关键字，再调整剩余元素成新堆。' },

  { q:"栈是 ⟦先进后出（LIFO）⟧ 的线性表，插入删除在同一端（栈顶）；队列是 ⟦先进先出（FIFO）⟧ 的线性表，允许插入的一端称为 ⟦队尾 Rear⟧，允许删除的一端称为 ⟦队头 Front⟧。循环队列：队满条件 (rear+1)%size=front，元素个数=(rear−front+size)%size。",
    b:["先进后出（LIFO）", "先进先出（FIFO）", "队尾 Rear", "队头 Front"], tags:["栈", "队列"], ref:"栈常考出栈序列合法性；队列常考循环队列的队满/队空判断。" },
  { q:"二叉树性质：第 i 层上最多有 ⟦2^(i-1)⟧ 个结点（i≥1）；深度为 k 的二叉树最多有 ⟦2^k−1⟧ 个结点（k≥1）；叶子结点数 n0 与度数为 2 的结点数 n2 的关系：⟦n0 = n2 + 1⟧；具有 n 个结点的完全二叉树深度为 ⟦⌊log₂n⌋+1⟧。按层序编号：i=1 是根；i>1 时双亲是 ⟦⌊i/2⌋⟧；2i≤n 时左孩子编号是 ⟦2i⟧；2i+1≤n 时右孩子编号是 ⟦2i+1⟧。",
    b:["2^(i-1)", "2^k−1", "n0 = n2 + 1", "⌊log₂n⌋+1", "⌊i/2⌋", "2i", "2i+1"], tags:["二叉树", "性质"], ref:"n0=n2+1 是最高频考点；n1（度1结点）只能为 0 或 1。" },
  { q:"二叉树遍历：前序 ⟦根、左、右⟧，中序 ⟦左、根、右⟧，后序 ⟦左、右、根⟧，另有层次遍历。由前序+中序（或后序+中序）可唯一确定一棵二叉树。图的深度优先遍历（DFS）类似于树的前序遍历，广度优先遍历（BFS）类似于树的 ⟦层次遍历⟧（借助队列实现）。",
    b:["根、左、右", "左、根、右", "左、右、根", "层次遍历"], tags:["遍历", "图"], ref:"中序+前序还原二叉树是下午题常客；BFS 用队列，DFS 用栈/递归。" },
  { q:"排序稳定性：稳定排序有 ⟦直接插入排序、冒泡排序、归并排序（及基数排序）⟧；不稳定排序有 ⟦简单选择排序、希尔排序、快速排序、堆排序⟧。比较次数与初始序列无关的是 ⟦简单选择排序⟧；快速排序平均空间复杂度为 ⟦O(log₂n)⟧（递归栈）；归并排序空间复杂度 O(n)。",
    b:["直接插入排序、冒泡排序、归并排序（及基数排序）", "简单选择排序、希尔排序、快速排序、堆排序", "简单选择排序", "O(log₂n)"], tags:["排序", "稳定性"], ref:"口诀：稳定“插冒归基”，不稳定“选希快堆”。" },
  { q:"哈希（散列）查找：构造哈希函数后用 ⟦线性探测法⟧ 等处理冲突——发生冲突时依次探测下一个存储单元。例：H(key)=key%11，49%11=5 与 38 冲突，依次探测 6、7 被占，最终存入 ⟦8⟧。装填因子=表中已有记录数/表长，装填因子越大冲突可能性越大。",
    b:["线性探测法", "8"], tags:["哈希", "查找"], ref:"同义词：哈希函数值相同的关键字；线性探测会占据非同义词的位置。" },
  { q:"链式存储：单链表只能从头结点开始 ⟦顺序遍历⟧ 整个链表；⟦循环单链表⟧ 可以从表中任一结点开始遍历整个链表。链表插入删除 ⟦不需要移动元素⟧，但不能随机访问，且无须事先估计存储空间大小。",
    b:["顺序遍历", "循环单链表", "不需要移动元素"], tags:["链表"], ref:"链表可随机访问是错误说法，这是必刷题高频陷阱。" },

]},
{ id:'g3', name:'算法设计策略', icon:'🎯', questions:[
  { q:'分治法：把一个问题拆分成多个小规模的相同子问题，一般用 ⟦递归⟧ 解决，也可用循环；关键词是 ⟦一分为二、一一合二⟧；经典问题有 ⟦归并排序、快速排序、矩阵乘法、二分搜索、斐波那契数列、大整数乘法、汉诺塔⟧。',
    b:['递归','一分为二、一一合二','归并排序、快速排序、矩阵乘法、二分搜索、斐波那契数列、大整数乘法、汉诺塔'], tags:['分治'], ref:'注意：不要陷入递归调用的证明，直接调用下层即可。' },
  { q:'贪心法：一般用于求 ⟦满意解⟧；特征是 ⟦局部最优，但整体不见得最优⟧，每步有明确的、既定的策略；经典问题有 ⟦最小生成树（普里姆、克鲁斯卡尔）、背包问题（如装箱）、活动场地安排、多机调度、找零钱⟧。',
    b:['满意解','局部最优，但整体不见得最优','最小生成树（普里姆、克鲁斯卡尔）、背包问题（如装箱）、活动场地安排、多机调度、找零钱'], tags:['贪心'], ref:'关键词：某一刻按照某个标准找到合适的就行；最后解可能最优也可能不是。' },
  { q:'动态规划法：用于求 ⟦最优解⟧，依据是 ⟦最优子结构⟧ 和递归式；特征是划分子问题、⟦使用数组存储子问题结果⟧、利用查询子问题结果构造最终结果；经典问题有 ⟦矩阵乘法、背包问题、LCS 最长公共子序列⟧；关键词：最优子结构、动态规划、子规模。',
    b:['最优解','最优子结构','使用数组存储子问题结果','矩阵乘法、背包问题、LCS 最长公共子序列'], tags:['动态规划'], ref:'不要陷入递归调用和查表操作，直接用即可。' },
  { q:'回溯法：特征是 ⟦系统地搜索一个问题的所有解或任一解⟧；经典问题有 ⟦N 皇后问题、图的遍历、迷宫、背包问题⟧；关键词是 ⟦冲突、返回⟧。',
    b:['系统地搜索一个问题的所有解或任一解','N 皇后问题、图的遍历、迷宫、背包问题','冲突、返回'], tags:['回溯'], ref:'遇到冲突就回退（返回），继续搜索其它分支。' },
  { q:'分治法能解决的问题一般具有 4 个特征：①规模缩小到一定程度容易解决；②可分解为若干规模较小的相同问题（⟦最优子结构⟧性质）；③子问题的解可以 ⟦合并为原问题的解⟧；④各子问题 ⟦相互独立⟧（不含公共子问题）。其中第③条是能否使用分治法的关键。',
    b:['最优子结构','合并为原问题的解','相互独立'], tags:['分治'], ref:'若不具备第③条特征，可考虑贪心法或动态规划法。' },
  { q:'回溯法又称 ⟦试探法⟧，把问题解空间转化为图或树结构后采用 ⟦深度优先搜索⟧ 策略遍历；走不通就退回再走，思路类同于图的深度优先搜索和二叉树的 ⟦后序遍历⟧。',
    b:['试探法','深度优先搜索','后序遍历'], tags:['回溯'], ref:'满足回溯条件的状态点称为“回溯点”。' },

  { q:"⟦动态规划法⟧：将要求解的问题一层层分解成规模逐步缩小的子问题，所有子问题按层次关系构成一棵 ⟦子问题树⟧，原问题的解依赖于子问题树中所有子问题的解（自底向上求解、保存子问题解避免重复计算）。典型应用：矩阵连乘、背包问题、最长公共子序列。",
    b:["动态规划法", "子问题树"], tags:["动态规划"], ref:"与分治的区别：动态规划的子问题往往不是相互独立的。" },
  { q:"⟦贪心法⟧：总是做出当前看来最好的选择，每步都是 ⟦局部最优⟧ 选择，但整体上不一定最优；不必穷尽所有可能解，因此耗费时间少、可快速得到 ⟦满意的解⟧。典型应用：部分背包、活动安排、最小生成树（Prim/Kruskal）。",
    b:["贪心法", "局部最优", "满意的解"], tags:["贪心"], ref:"贪心不一定得到全局最优解；动态规划才能保证最优。" },

]},
{ id:'g4', name:'软件工程', icon:'🛠️', questions:[
  { q:'V 模型中测试与开发的对应关系：⟦单元测试⟧ 对应详细设计/编码，⟦集成测试⟧ 对应概要设计，⟦系统测试⟧ 对应需求规格说明，⟦验收测试⟧ 对应需求分析。',
    b:['单元测试','集成测试','系统测试','验收测试'], tags:['软件测试','V模型'], ref:'根据 V 模型图示展开：左边是开发（需求→概要→详细→编码），右边是测试（单元→集成→系统→验收）。' },
  { q:'瀑布模型的主要特点是 ⟦缺乏灵活性⟧。它按需求分析、设计、编码、测试和交付的顺序进行，每个阶段都有明确任务和输出；一旦要回溯到之前的阶段重新设计编码测试，会带来成本和时间上的巨大开销。',
    b:['缺乏灵活性'], tags:['开发模型','瀑布'], ref:'严格线性、阶段间依赖强，难以应对需求变化，所以"缺乏灵活性"。' },
  { q:'关于螺旋模型，不正确的说法是 ⟦基于该模型进行软件开发，开发成本低⟧。螺旋模型的特点是：支持用户需求的 ⟦动态变化⟧、要求开发人员具有 ⟦风险分析⟧ 能力、将开发过程划分为几个螺旋周期、每个周期大致和瀑布模型相符合。',
    b:['基于该模型进行软件开发，开发成本低','动态变化','风险分析'], tags:['开发模型','螺旋'], ref:'螺旋模型强调风险分析，成本较高，所以"开发成本低"是错误说法。' },
  { q:'关于加工规格说明，不正确的说法是 ⟦加工规格说明应该采用实现软件的程序设计语言来描述以提高开发效率⟧。正确的是：对每一个基本加工必须有一个加工规格说明；加工规格说明必须描述把输入数据流变换为输出数据流的加工规则。',
    b:['加工规格说明应该采用实现软件的程序设计语言来描述以提高开发效率'], tags:['需求分析','加工规格说明'], ref:'加工规格说明用什么写都可以（结构化语言/判定表/判定树），不要求用程序设计语言。' },
  { q:'关于模块独立原则，不正确的说法是 ⟦模块规模越小越好⟧。正确做法：将系统划分为相对独立的模块，模块之间做到 ⟦高内聚、低耦合⟧，模块的扇入系数和扇出系数要 ⟦合理⟧。',
    b:['模块规模越小越好','高内聚、低耦合','合理'], tags:['软件设计','模块化'], ref:'模块不是越小越好，过度拆分反而增加接口复杂度；要适度。' },
  { q:'为了改进应用软件的可靠性和可维护性，并适应未来软硬件环境变化而主动增加预防性新功能的维护属于 ⟦预防性⟧ 维护；对系统性能进行完善属于 ⟦完善性⟧ 维护；出错才改正属于 ⟦改正性⟧ 维护；为适应环境变化而修改属于 ⟦适应性⟧ 维护。',
    b:['预防性','完善性','改正性','适应性'], tags:['软件维护'], ref:'四类维护：改正性(出错才改)、适应性(适应环境)、完善性(完善性能/功能)、预防性(主动预防)。' },
  { q:'在进行风险监测时，其目的不包括 ⟦消除风险⟧。风险监测的目的是：评估所预测的风险是否发生、保证正确实施了风险缓解步骤、收集用于后续进行风险分析的信息。',
    b:['消除风险'], tags:['项目管理','风险'], ref:'风险只能降低、无法彻底消除，所以"消除风险"不是风险监测的目的。' },
  { q:'常见软件开发方法：⟦结构化方法⟧ 注重整体性和全局性、应用最广泛但开发周期长；⟦原型法⟧ 先快速开发原型再反复修改；⟦面向对象方法⟧ 用对象表示客观事物、可复用，涉及分析、设计、实现三个阶段；⟦敏捷开发⟧ 以人为核心、迭代、循序渐进，适用于需求难以事先确定的项目。',
    b:['结构化方法','原型法','面向对象方法','敏捷开发'], tags:['软件开发方法'], ref:'结构化方法缺点：文档繁琐、效率低，且要求开发前全面获取需求不现实。' },
  { q:'模块耦合由低到高：⟦无直接耦合、数据耦合、标记耦合、控制耦合、外部耦合、公共耦合、内容耦合⟧；模块内聚由高到低：⟦功能内聚、顺序内聚、通信内聚、过程内聚、时间内聚、逻辑内聚、偶然内聚⟧。设计原则是 ⟦高内聚、低耦合⟧。',
    b:['无直接耦合、数据耦合、标记耦合、控制耦合、外部耦合、公共耦合、内容耦合','功能内聚、顺序内聚、通信内聚、过程内聚、时间内聚、逻辑内聚、偶然内聚','高内聚、低耦合'], tags:['软件设计','耦合','内聚'], ref:'数据耦合传值、标记耦合传数据结构、控制耦合传控制变量；功能内聚最强、偶然内聚最弱。' },
  { q:'白盒测试覆盖强弱：⟦语句覆盖⟧ 是最弱的覆盖标准；⟦判定（分支）覆盖⟧ 只关心判定表达式的真假；⟦条件覆盖⟧ 关心判定中每个条件的取值（与判定覆盖互相不一定包含）；⟦路径覆盖⟧ 是较强的覆盖标准，要求每条可能路径至少经过一次。',
    b:['语句覆盖','判定（分支）覆盖','条件覆盖','路径覆盖'], tags:['软件测试','白盒'], ref:'覆盖强度大致：语句 < 判定/条件 < 路径。' },
  { q:'系统设计包括 ⟦概要设计⟧ 和 ⟦详细设计⟧ 两个基本步骤：概要设计包括总体结构设计、数据结构及数据库设计、编写概要设计文档、评审；详细设计包括每个模块的详细设计、模块内部数据结构设计、数据库物理设计、代码/输入输出/用户界面等其他设计、编写详细设计说明书、评审。',
    b:['概要设计','详细设计'], tags:['软件设计'], ref:'概要设计管“总体结构”，详细设计管“模块内部”。' },

  { q:"⟦瀑布模型⟧：将软件生命周期各活动规定为依线性顺序连接的若干阶段（需求分析→设计→编码→测试→运行维护），容易理解、管理成本低，但 ⟦需求必须能完整、正确、清晰地表达⟧，错误往往到项目后期才被发现，风险控制能力较弱。适用于 ⟦需求明确且稳定⟧ 的项目。",
    b:["需求必须能完整、正确、清晰地表达", "需求明确且稳定"], tags:["瀑布模型"], ref:"瀑布=线性顺序；不适用于需求模糊的项目。" },
  { q:"⟦增量模型⟧：融合瀑布模型的基本成分和原型实现的迭代特征，第一个增量往往是 ⟦核心产品⟧，每一个增量均发布一个可操作的产品。⟦演化模型⟧：迭代的过程模型，特别适用于 ⟦对软件需求缺乏准确认识⟧ 的情况，典型的演化模型有原型模型和螺旋模型。",
    b:["核心产品", "对软件需求缺乏准确认识"], tags:["增量模型", "演化模型"], ref:"原型法适合用户需求不清、需求经常变化的情况。" },
  { q:"⟦螺旋模型⟧：将瀑布模型和演化模型结合起来，加入了两种模型均忽略的 ⟦风险分析⟧，特别适用于 ⟦庞大、复杂并且具有高风险⟧ 的系统。每个螺旋周期分 4 个步骤：①制订计划 ②⟦风险分析⟧ ③实施工程 ④⟦用户评估⟧。",
    b:["风险分析", "庞大、复杂并且具有高风险", "风险分析", "用户评估"], tags:["螺旋模型"], ref:"看到“风险分析”就选螺旋模型；四个步骤按顺序记。" },
  { q:"⟦喷泉模型⟧：以 ⟦用户需求为动力⟧、以 ⟦对象为驱动⟧ 的模型，适用于 ⟦面向对象⟧ 的开发方法；各阶段没有明显界线（迭代性和无间隙性），克服了瀑布模型不支持软件重用和多项开发活动集成的局限性。",
    b:["用户需求为动力", "对象为驱动", "面向对象"], tags:["喷泉模型"], ref:"喷泉模型优点：提高开发效率、节省时间；缺点：需要大量开发人员、文档管理难。" },
  { q:"⟦统一过程（UP/RUP）模型⟧：是一种 ⟦用例和风险驱动、以架构为中心、迭代并且增量⟧ 的开发过程，由 UML 方法和工具支持。4 个技术阶段：⟦起始阶段⟧（构想文档、初始用例模型）、⟦精化阶段⟧（需求分析和架构演进）、⟦构建阶段⟧（产生实现模型）、⟦移交阶段⟧（β测试报告和用户反馈）。",
    b:["用例和风险驱动、以架构为中心、迭代并且增量", "起始阶段", "精化阶段", "构建阶段", "移交阶段"], tags:["统一过程", "RUP"], ref:"口诀：起始→精化→构建→移交；架构为中心是 UP 的标志。" },
  { q:"程序环路复杂度 V(G)=⟦封闭区域（闭合环）的个数 + 1⟧，也等于 ⟦判定节点个数 + 1⟧，用于衡量源程序的复杂度，是基本路径测试的基础。",
    b:["封闭区域（闭合环）的个数 + 1", "判定节点个数 + 1"], tags:["环路复杂度", "白盒测试"], ref:"流图中数“圈”再+1；有判定节点数 N 个则 V(G)=N+1。" },
  { q:"静态测试：被测程序 ⟦不在机器上运行⟧，采用人工检测和计算机辅助静态分析的手段（含走查、审查、代码评审）。动态测试：通过 ⟦运行程序⟧ 发现错误，一般采用黑盒测试和白盒测试。⟦黑盒测试⟧（功能测试）不考虑内部结构，测试外部特性；⟦白盒测试⟧（结构测试）根据程序内部结构和逻辑设计测试用例。",
    b:["不在机器上运行", "运行程序", "黑盒测试", "白盒测试"], tags:["软件测试"], ref:"静态=不跑代码；黑盒=只看输入输出；白盒=看内部逻辑。" },
  { q:"测试阶段划分：⟦单元测试⟧（模块级，常用白盒）→ ⟦集成测试⟧（模块组装，接口测试，自顶向下/自底向上/三明治式）→ ⟦确认测试⟧（验证是否满足需求，含 α 测试与 β 测试）→ ⟦系统测试⟧（整个系统环境，含性能、压力、恢复测试等）。",
    b:["单元测试", "集成测试", "确认测试", "系统测试"], tags:["测试阶段"], ref:"α 测试=用户在开发方场所测试；β 测试=用户在实际使用环境测试。" },

]},
{ id:'g5', name:'面向对象与 UML', icon:'🧩', questions:[
  { q:'UML 类图给出软件系统的一种静态设计视图，用 ⟦泛化⟧ 关系可明确表示两类事物之间存在的特殊/一般关系。',
    b:['泛化'], tags:['UML','关系'], ref:'聚合＝整体与部分、生命周期不同（属关联关系）；依赖＝一个事物变化影响另一个事物；泛化＝特殊/一般关系；实现＝接口与类。' },
  { q:'面向对象测试分为四个层次执行：⟦算法层⟧（测试类中的每个方法）、⟦类层⟧（测试同一个类中方法与属性的相互作用）、⟦模版层⟧（测试一组协同工作的类）、⟦系统层⟧（把各个子系统组装成完整的面向对象软件系统进行测试）。',
    b:['算法层','类层','模版层','系统层'], tags:['面向对象','测试'], ref:'由小到大：算法层→类层→模版层→系统层。' },
  { q:'对于面向对象的设计，继承可分为 ⟦多重继承⟧（多个父类）和 ⟦单重继承⟧（一个父类）；而 ⟦分布式继承⟧ 不是面向对象体现的继承类型。',
    b:['多重继承','单重继承','分布式继承'], tags:['面向对象','继承'], ref:'本题考查面向对象基础：分布式继承不属于面向对象的继承类型。' },
  { q:'进行面向对象系统设计时，若存在包 A 依赖于包 B、包 B 依赖于包 C、包 C 依赖于包 A，则此设计违反了 ⟦无环依赖⟧ 原则。',
    b:['无环依赖'], tags:['面向对象','设计原则'], ref:'包之间形成依赖环 → 直接违反无环依赖原则；稳定抽象原则强调包的抽象程度与稳定程度一致。' },
  { q:'UML 中有 ⟦4⟧ 种事物（结构事物、行为事物、分组事物、注释事物）和 ⟦4⟧ 种关系：⟦依赖、关联、泛化、实现⟧；依赖的变体有精化、跟踪、包含和延伸。',
    b:['4','4','依赖、关联、泛化、实现'], tags:['UML'], ref:'聚合/组合是关联关系的特殊形式；泛化=特殊/一般，实现=接口与类。' },

  { q:"面向对象分析包含 5 个活动：⟦认定对象、组织对象、对象间的相互作用、定义对象的操作、定义对象的内部信息⟧；面向对象设计的活动：⟦识别类及对象、定义属性、定义服务、识别关系、识别包⟧。结构化分析用 ⟦数据流图（DFD）⟧ 建立功能模型完成需求分析，面向对象分析用 ⟦用例图⟧ 完成需求分析。",
    b:["认定对象、组织对象、对象间的相互作用、定义对象的操作、定义对象的内部信息", "识别类及对象、定义属性、定义服务、识别关系、识别包", "数据流图（DFD）", "用例图"], tags:["面向对象分析"], ref:"OOA 五活动 vs OOD 五活动要能区分。" },
  { q:"类的分类：⟦实体类⟧（保存需要持久存储的信息，对应数据库中的表/记录）、⟦边界类⟧（系统与外界的交互，如界面）、⟦控制类⟧（业务逻辑处理，协调实体类和边界类）。",
    b:["实体类", "边界类", "控制类"], tags:["类的分类"], ref:"实体=存数据，边界=管界面，控制=跑逻辑。" },
  { q:"面向对象设计 7 大原则：⟦单一职责⟧（一个类只有一个引起它变化的原因）、⟦开放-封闭⟧（对扩展开放、对修改封闭）、⟦里氏替换⟧（子类必须能替换父类）、⟦依赖倒置⟧（依赖抽象而不依赖具体）、⟦接口分离⟧（多个专门接口好于单一总接口）、⟦组合重用⟧（尽量使用组合而不是继承）、⟦迪米特⟧（最少知识原则，对其他对象有尽可能少的了解）。",
    b:["单一职责", "开放-封闭", "里氏替换", "依赖倒置", "接口分离", "组合重用", "迪米特"], tags:["设计原则"], ref:"高频考“某条原则描述的是什么”，如“对扩展开放对修改封闭=开闭原则”。" },
  { q:"UML 图分静态图与动态图：静态（结构）图有 ⟦类图、对象图、构件图、部署图、包图、组合结构图⟧；动态（行为）图有 ⟦用例图、顺序图（序列图）、通信图、状态图、活动图、定时图、交互概览图⟧。类图给出系统的 ⟦静态设计视图⟧；对象图是某一时刻的 ⟦静态快照⟧；用例图用于 ⟦需求分析阶段⟧。",
    b:["类图、对象图、构件图、部署图、包图、组合结构图", "用例图、顺序图（序列图）、通信图、状态图、活动图、定时图、交互概览图", "静态设计视图", "静态快照", "需求分析阶段"], tags:["UML"], ref:"构件图=静态实现视图；部署图=静态部署视图（物理建模）。" },
  { q:"UML 交互图（动态建模）4 种：⟦序列图⟧（强调消息时间顺序，特征：对象生命线和控制焦点）、⟦通信图⟧（早期称协作图，强调收发信息的对象的结构组织）、⟦交互概览图⟧（活动图和顺序图的混合物，UML2.0 新增）、⟦定时图⟧（强调消息跨越不同对象的实际时间）。",

  { q:'下列算法中属于 Hash（摘要）算法的是 ⟦SHA⟧。加密算法分类：对称加密算法有 ⟦DES、3DES、AES⟧；非对称加密算法有 ⟦RSA、ECC⟧；摘要算法有 ⟦SHA、MD5⟧。',

  { q:'为 IP 数据报文进行加密，通常在 ⟦网络层⟧ 使用 ⟦IPSec⟧ 来实现；而在数据链路层常用 ⟦PPTP / L2TP⟧。',

  { q:'数据库三级模式：⟦概念模式⟧ 是全体数据的逻辑结构和特征描述（所有用户的公共数据视图，一个数据库只有一个）；⟦外模式⟧ 描述用户看到的那部分数据（可有多个）；⟦内模式⟧ 定义数据的存储组织和物理结构（只有一个）。',

  { q:'关系规范化：⟦1NF⟧ 要求每个分量不可分割；⟦2NF⟧ 在 1NF 基础上消除非主属性对候选键的 ⟦部分依赖⟧；⟦3NF⟧ 在 2NF 基础上消除非主属性对候选键的 ⟦传递依赖⟧。',

  { q:'事务的 ACID 性质：⟦原子性⟧（要么都做要么都不做）、⟦一致性⟧（完成时数据保持一致状态）、⟦隔离性⟧（事务之间相互隔离）、⟦持久性⟧（完成后更新永久有效）。',

  { q:'三级封锁协议：⟦一级⟧ 修改前加 X 锁、事务结束释放，可解决 ⟦丢失修改⟧；⟦二级⟧ 再加读前 S 锁、读完即放，可解决 ⟦读脏数据⟧；⟦三级⟧ 读前 S 锁直到事务结束才释放，可解决丢失修改、读脏数据、⟦不可重复读⟧ 三类不一致。',
    b:['一级','丢失修改','二级','读脏数据','三级','不可重复读'], tags:['数据库','封锁'], ref:'X 锁=排它锁，S 锁=共享锁；级别越高解决的不一致问题越多。' },
  { q:'Armstrong 公理三条基本推理规则：⟦自反律⟧（若 Y⊆X⊆U 则 X→Y）、⟦增广律⟧（若 X→Y 则 XZ→YZ）、⟦传递律⟧（若 X→Y、Y→Z 则 X→Z）；由此可推出合并规则、伪传递规则和 ⟦分解规则⟧。',

  { q:"关系代数：⟦选择σ⟧ 取关系 R 中符合条件的 ⟦行⟧；⟦投影π⟧ 取符合条件的 ⟦列⟧；并/差/交要求两关系具有相同的关系模式；笛卡尔积是（n+m）列元组的集合；⟦等值连接⟧ 取笛卡尔积中属性值相等的元组；⟦自然连接⟧ 是特殊的等值连接，要求比较的属性列相同并把结果中 ⟦重复属性去掉⟧。",

  { q:"数据模型三要素：⟦数据结构、数据操作、数据的约束条件⟧。概念数据模型（信息模型）以用户视角建模，如 ⟦E-R 模型⟧；基本数据模型以计算机视角建模，有层次模型、网状模型、⟦关系模型⟧和面向对象模型。E-R 图中：实体用 ⟦矩形⟧ 表示，联系用 ⟦菱形⟧ 表示（1:1、1:n、m:n），属性用 ⟦椭圆⟧ 表示；属性分简单/复合、单值/多值、NULL、派生属性。",

  { q:"OSI 七层参考模型（低→高）：⟦物理层⟧（二进制位传输：RS232、RJ-45）、⟦数据链路层⟧（传输以帧为单位的的信息，MAC 地址：IEEE 802.3、PPP）、⟦网络层⟧（分组传输和路由选择，逻辑地址/IP：IP、IPX）、⟦传输层⟧（端到端连接，服务访问点为端口：TCP、UDP、SPX）、⟦会话层⟧（互连主机通信：RPC、SQL）、⟦表示层⟧（数据表示：JPEG、ASCII、DES、MPEG）、⟦应用层⟧（处理网络应用：HTTP、FTP、SMTP、Telnet）。",
    b:["物理层", "数据链路层", "网络层", "传输层", "会话层", "表示层", "应用层"], tags:["OSI", "网络"], ref:"自下而上第一个提供端到端服务的是传输层；路由器=网络层、交换机=数据链路层、集线器=物理层。" },
  { q:"TCP/IP 协议族：⟦ARP⟧ 将 IP 地址转换为物理地址，⟦RARP⟧ 将物理地址转换为 IP 地址；⟦ICMP⟧ 专门用于发送差错报文；⟦TCP⟧ 面向连接、可靠，建立和关闭连接均需要通过 ⟦三次握手⟧ 确认；⟦UDP⟧ 提供无连接的、不可靠的数据报传输服务，高效但不保证完整性和顺序。",

  { q:"子网划分与子网掩码：网络号+子网号+主机号。例：C 类网段划分 5 个子网、每个子网最少 20 台主机——子网位至少 ⟦3⟧ 位（2³=8≥5），主机位至少 ⟦5⟧ 位（2⁵−2=30≥20），故子网掩码为 255.255.255.⟦11100000⟧=⟦255.255.255.224⟧。",

  { q:"访问控制类型：⟦强制访问控制（MAC）⟧——用户不能改变安全级别或对象的安全属性，主体和客体都分配安全标签；⟦自主访问控制（DAC）⟧——客体属主自行授权，使用访问控制列表 ACL；⟦基于角色的访问控制（RBAC）⟧——管理员定义角色，用户被动接受且不能改变。",

  { q:"位示图法管理文件存储空间：每一位对应一个物理块，0=空闲、1=占用。计算：物理块号 ÷ 字长 = 位示图中的字编号（从 0 起）。例：字长 32 位，2053 号物理块对应位示图中编号为 ⟦2053÷32=64.15⟧，即第 ⟦64⟧ 个字。",

]},
{ id:'g8', name:'程序设计语言', icon:'✍️', questions:[
  { q:'后缀式（逆波兰式）是把运算符写在运算对象之后，其运算规则是运算符的优先级和结合性 ⟦遵循惯例⟧（无需括号即可唯一确定运算顺序）。',
    b:['遵循惯例'], tags:['程序语言','后缀式'], ref:'本题考查程序设计语言后缀式：后缀式无括号，按运算符出现顺序计算。' },
  { q:'与直接运行编译后的机器码相比，通过解释器运行程序的速度 ⟦更慢⟧。编译型语言（如 C）直接编译成机器码在硬件上执行；解释型语言（如 Python、Ruby）的源代码需要解释器一行一行地读取、分析和执行，所以通常更慢。',

  { q:'在程序设计语言中，将 ⟦浮点类型数据与字符串类型数据相加⟧ 属于动态语义错误；而关键词（或保留字）拼写错误属于 ⟦语法错误⟧。',

  { q:'Python 中可变的数据类型有 ⟦dict（字典）⟧ 和 ⟦set（集合）⟧（此外还有 list 列表）；而 int、float、str、tuple 是不可变类型。',

  { q:'进程是系统进行 ⟦资源分配⟧ 的基本单位，线程是 CPU 调度的基本单位。同一进程中的多个线程 ⟦共享⟧ 内存地址空间、代码、数据和文件等，但各自拥有独立的 ⟦程序计数器⟧ 和 ⟦寄存器⟧。',
    b:['资源分配','共享','程序计数器','寄存器'], tags:['操作系统','进程线程'], ref:'进程管理：线程共享进程的资源（地址空间/代码/数据/文件），私有程序计数器、寄存器、栈。' },
  { q:'编译过程的 6 个阶段：⟦词法分析⟧（识别单词，词法规则用 3 型文法或正规式表示）→ ⟦语法分析⟧（检查逻辑结构，用上下文无关文法/2 型文法）→ ⟦语义分析⟧（检查静态语义错误，用语法制导翻译）→ ⟦中间代码生成⟧（逆波兰式、四元式、三元式和树，与机器无关）→ ⟦代码优化⟧ → ⟦目标代码生成⟧，贯穿始终的有符号表管理和出错处理。',
    b:['词法分析','语法分析','语义分析','中间代码生成','代码优化','目标代码生成'], tags:['编译原理'], ref:'静态错误=语法错误+静态语义错误（编译时发现）；动态语义错误（除零、下标越界、死循环）运行时才暴露。' },
  { q:'文法 G={Vt, Vn, S, P}：⟦Vt⟧ 是终结符号集合；⟦Vn⟧ 是非终结符号集合；⟦S⟧ 是开始符号；⟦P⟧ 是产生式集合。',
    b:['Vt','Vn','S','P'], tags:['文法'], ref:'确定的有限自动机（DFA）：每个状态基于输入字符都能做确定的状态转换；NFA 则存在多态转换或 ε 迁移。' },
  { q:'函数参数传递方式：⟦传值调用⟧ 形参取实参的值，形参改变 ⟦不会影响⟧ 实参；⟦引用调用（传址）⟧ 形参取实参的地址，形参改变 ⟦会同步改变⟧ 实参。',
    b:['传值调用','不会影响','引用调用（传址）','会同步改变'], tags:['程序语言','函数调用'], ref:'例：引用调用 la=3×3+1=10，y=10×2=20；值调用 la=3，y=3×2=6。' },

  { q:"Chomsky 文法分类：⟦0 型文法⟧（短语文法，对应图灵机）、⟦1 型文法⟧（上下文有关文法）、⟦2 型文法⟧（上下文无关文法，语法分析广泛使用）、⟦3 型文法⟧（对应正规式/正规语言，词法分析使用）。限制条件逐级增多，能力逐级减弱。",
    b:["0 型文法", "1 型文法", "2 型文法", "3 型文法"], tags:["文法", "Chomsky"], ref:"词法=3型（正规式），语法=2型（上下文无关），必考对应关系。" },
  { q:"编译方式 ⟦生成⟧ 逻辑上与源程序等价的独立目标程序（源程序和编译程序都不再参与目标程序的执行过程）；解释方式 ⟦不生成⟧ 独立目标程序（解释程序和源程序要参与运行过程，控制权在解释程序）。这是两种语言处理程序的根本区别。",
    b:["生成", "不生成"], tags:["编译与解释"], ref:"解释程序执行慢但可交互；编译程序一次编译多次运行。" },
  { q:"正规式规则：如 A→xB、B→y，则 A=⟦xy⟧；如 A→xA|y，则 A=⟦x*y⟧（x* 代表 x 从 0 到无穷多个）；如 A→x、A→y，则 A=⟦x|y⟧。确定的有限自动机 ⟦DFA⟧：每个状态基于输入字符都能做确定的状态转换；⟦NFA⟧ 存在多个可能的状态转换。",
    b:["xy", "x*y", "x|y", "DFA", "NFA"], tags:["正规式", "有限自动机"], ref:"DFA/NFA 考“该自动机能识别哪个字符串”——从初态走到终态即为可识别。" },

]},
{ id:'g9', name:'代码填空技巧', icon:'💡', questions:[
  { q:'代码填空的常见技巧：①仔细看；②编程经验；③⟦给变量代入数据，尝试在脑海中运行程序⟧。解题关键是仔细检查所有用到的变量（例如循环变量 j 是否有初始赋值）。',
    b:['给变量代入数据，尝试在脑海中运行程序'], tags:['代码填空','技巧'], ref:'例：int main(){ int i, j, count=1; ... } —— 注意检查此处是否缺少 j 的初始赋值。' },
  { q:'代码填空时要仔细观察、对比 ⟦代码说明⟧ 和代码，找到得分点（如 temp=( )、tempCost=temp、cost[i][j]=tempCost，以及缺少的 trace[][] 记录）。',
    b:['代码说明'], tags:['代码填空','技巧'], ref:'题干给的代码说明/注释往往就是得分点的提示。' },
  { q:'代码填空时，一些变量名有特殊含义：一般用 ⟦max / min⟧ 保存最大值 / 最小值；当 if(max < c[i][j]) 成立时要修改 max 值，并用 ⟦maxi = i、maxj = j⟧ 记录最大值所在的下标。',
    b:['max / min','maxi = i、maxj = j'], tags:['代码填空','技巧'], ref:'temp 常作中间变量做数值交换；maxi/maxj 记录最大值的下标位置。' },
  { q:'KMP 模式匹配算法用 ⟦next 数组⟧ 对匹配过程进行优化。匹配时：如果 j=-1 或 t[i]=s[j]，则将 i 和 j 分别加 1 继续比较下一字符；否则将 j 向右滑动到 ⟦next[j]⟧ 的位置，即 j=next[j]；匹配失败返回 ⟦-1⟧。',
    b:['next 数组','next[j]','-1'], tags:['代码填空','KMP'], ref:'模式匹配＝在主串 t 中找子串 s，成功返回 s 在 t 中的位置，否则返回 -1。' },
  { q:'代码填空要仔细对比 ⟦题干公式⟧ 和代码找到得分点，例如 LCS 最长公共子序列的递归式条件与结果（if(max<c[i][j]){ maxj=j; maxi=i; } 处缺少递归式条件与结果）。',
    b:['题干公式'], tags:['代码填空','技巧'], ref:'把题干给出的递归式/公式对照代码，缺什么补什么。' }
]},
{ id:'g10', name:'知识产权 · 英语题', icon:'⚖️', questions:[
  { q:"知识产权保护期限：⟦署名权、修改权、保护作品完整权⟧——没有期限限制；公民作品的⟦发表权、使用权、获得报酬权⟧——作者终生及死亡后第 ⟦50 年⟧的 12 月 31 日；单位作品——首次发表后第 50 年的 12 月 31 日（未发表则不受保护）；⟦发明专利权⟧——20 年（自申请日起）；⟦实用新型与外观设计专利权⟧——10 年（自申请日起）；⟦商标权⟧——10 年，期满可续注；⟦商业秘密权⟧——没有限制。",
    b:["署名权、修改权、保护作品完整权", "50 年", "发明专利权", "实用新型与外观设计专利权", "商标权", "商业秘密权"], tags:["知识产权", "保护期限"], ref:"记忆：人身权无限期；专利发明20年、其他专利10年；商标10年可续；商业秘密无限。" },
  { q:"知识产权归属：⟦职务作品⟧——利用单位物质技术条件创作并由单位承担责任、或合同约定的，除署名权外其他著作权归单位，其他作品作者拥有著作权、单位有权在业务范围内优先使用；⟦职务软件作品⟧——本职工作明确规定目标、本职工作结果、使用单位资金专用设备未公开信息并由单位担责的，著作权归单位；⟦职务发明⟧——本职工作、交付的任务、离职退休调动后 ⟦1 年内⟧与原单位工作相关的发明创造，专利权归单位；⟦委托创作⟧——合同约定归委托方，未约定归创作方；⟦合作开发⟧——共同享有著作权；商标与专利：⟦谁先申请谁拥有⟧（商标同时申请看谁先使用，专利同时申请协商归属）。",
    b:["职务作品", "职务软件作品", "职务发明", "1 年内", "委托创作", "合作开发", "谁先申请谁拥有"], tags:["知识产权", "归属"], ref:"委托创作“有约从约，无约归创作方”；只提供咨询意见/物质条件的 ⟦不享有著作权⟧。" },
  { q:"知识产权的特点：⟦无形性⟧（智力成果）、⟦双重性⟧（多权并存）、⟦确认性⟧（依法审查）、⟦独占性⟧（权利人的相对性）、⟦地域性⟧、⟦时间性⟧。计算机软件著作权的客体：⟦计算机程序及其有关文档⟧。软件合法持有人的权利：⟦安装、备份⟧ 和 ⟦改进⟧（依据协议使用）。",
    b:["无形性", "双重性", "确认性", "独占性", "地域性", "时间性", "计算机程序及其有关文档", "安装、备份", "改进"], tags:["知识产权", "软件著作权"], ref:"计算机软件和实用艺术品受著作权保护的同时，还可申请发明/外观设计专利（工业产权）。" },
  { q:"软考英语题技巧：上午卷 71~75 题，1 空约 1 分。高频主题与词汇：项目管理（project management：⟦scoping 范围界定、planning 计划、staffing 人员配备、controlling 控制、specifications 规格说明书、deadline 截止时间、deliverables 可交付物⟧）；软件工程概念（⟦release plan 发布计划、feasibility 可行性、specification 规格说明、reusable 可复用的、recurring patterns 重复出现的模式⟧）；架构（⟦loosely coupled 松耦合、independently deployable 独立部署、SOA 面向服务架构、Web services、statelessness 无状态⟧）；运维（⟦system recovery 系统恢复、program maintenance 程序维护、technical support 技术支持、system enhancement 系统增强、triggered 触发⟧）；DevOps（开发与运维一体化、continuous 持续的、automated process 自动化流程）；新技术（⟦low-code 低代码、RAD 快速应用开发⟧）。",
    b:["scoping 范围界定、planning 计划、staffing 人员配备、controlling 控制、specifications 规格说明书、deadline 截止时间、deliverables 可交付物", "release plan 发布计划、feasibility 可行性、specification 规格说明、reusable 可复用的、recurring patterns 重复出现的模式", "loosely coupled 松耦合、independently deployable 独立部署、SOA 面向服务架构、Web services、statelessness 无状态", "system recovery 系统恢复、program maintenance 程序维护、technical support 技术支持、system enhancement 系统增强、triggered 触发", "low-code 低代码、RAD 快速应用开发"], tags:["英语题"], ref:"答题技巧：先看选项词性判断空格词性；遇到项目管理题优先考虑 specifications/deadline；SOA 题常考 style（架构风格）vs technology（实现技术）。" },
]}
];
</script>

<script>
/* ================ 工具 ================ */
var $=function(s){return document.querySelector(s)};
var $$=function(s){return document.querySelectorAll(s)};
var store={
  get:function(k,d){ try{ var v=JSON.parse(localStorage.getItem(k)); return (v===null||v===undefined)?d:v; }catch(e){ return d; } },
  set:function(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
var esc=function(s){ return String(s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };

/* ================ 漂浮爱心 ================ */
(function(){
  var box=$('#hearts'), icons=['❤','💗','🧡','💛','💖'];
  for(var i=0;i<14;i++){
    var s=document.createElement('span');
    s.textContent=icons[i%icons.length];
    s.style.left=(Math.random()*100)+'%';
    s.style.fontSize=(10+Math.random()*16)+'px';
    var d=9+Math.random()*11;
    s.style.animationDuration=d+'s';
    s.style.animationDelay=(-Math.random()*d)+'s';
    box.appendChild(s);
  }
})();

/* ================ 倒计时 ================ */
(function(){
  var exam=new Date((window.EXAM_DATE||'2026-10-24')+'T00:00:00');
  $('#examDate').textContent=window.EXAM_DATE||'2026-10-24';
  var now=new Date(); now.setHours(0,0,0,0);
  var d=Math.round((exam-now)/86400000);
  $('#dDay').textContent=(d>=0)?d:'已考';
})();

/* ================ 渲染内容 ================ */
var DATA=window.DATA||[];
var qSeq=0;
function renderBlank(q){
  return esc(q).replace(/⟦(.+?)⟧/g,function(m,g1){ return '<span class="blank" data-ans="'+esc(g1)+'">'+esc(g1)+'</span>'; });
}
function render(){
  var toc=$('#toc'), content=$('#content'), total=0;
  DATA.forEach(function(g){ total+=g.questions.length; });
  $('#totalQ').textContent=total;
  $('#totalG').textContent=DATA.length;

  toc.innerHTML=DATA.map(function(g){
    return '<a href="#'+g.id+'">'+g.icon+' '+esc(g.name)+'<span class="n">'+g.questions.length+'</span></a>';
  }).join('');

  content.innerHTML=DATA.map(function(g){
    var cards=g.questions.map(function(q){
      qSeq++;
      var tags=(q.tags||[]).map(function(t){ return '<span class="tag">'+esc(t)+'</span>'; }).join('');
      var ansWords=(q.b||[]).map(function(w){ return '<span class="blank" data-ans="'+esc(w)+'">'+esc(w)+'</span>'; }).join(' ');
      var ref=q.ref?'<details class="ref"><summary>参考解析 / 记忆补充</summary><div class="ref-body">'+esc(q.ref)+'</div></details>':'';
      var ansLine=(q.b&&q.b.length)?'<div class="ansline">🔑 <span class="ok">答案</span>：'+ansWords+'</div>':'';
      var hay=(g.name+' '+q.q+' '+(q.tags||[]).join(' ')+' '+(q.ref||'')).toLowerCase();
      return '<article class="card" data-search="'+esc(hay)+'">'+
        '<div class="q-top">'+
          '<span class="q-num">'+('0'+qSeq).slice(-2)+'</span>'+
          '<div class="q-text">'+renderBlank(q.q)+'</div>'+
          '<div class="q-actions">'+
            '<button class="mini recite" title="遮住/显示这条答案">遮</button>'+
            '<button class="mini hl-btn" title="荧光笔划重点">✎</button>'+
          '</div>'+
        '</div>'+
        ansLine+ref+
        (tags?'<div class="tags">'+tags+'</div>':'')+
      '</article>';
    }).join('');
    return '<section class="group" id="'+g.id+'">'+
      '<div class="group-head"><span class="emoji">'+g.icon+'</span><h2>'+esc(g.name)+'</h2>'+
      '<span class="cnt">'+g.questions.length+' 条</span><span class="line"></span></div>'+
      cards+'</section>';
  }).join('');
}
render();

/* ================ 背诵模式 ================ */
var recite=store.get('recite',false);
function applyRecite(){
  document.body.classList.toggle('recite',recite);
  $('#btnRecite').textContent=recite?'🙉 背诵模式：开':'🙈 背诵模式：关';
  $('#btnRecite').classList.toggle('on',recite);
  store.set('recite',recite);
}
$('#btnRecite').onclick=function(){ recite=!recite; applyRecite(); };
applyRecite();

/* 单条遮罩 + 荧光笔 */
var hlColors=['hl','pink','green'], hlIdx=0;
document.addEventListener('click',function(e){
  var t=e.target;
  if(t.classList.contains('mini')&&t.classList.contains('recite')){
    var card=t.closest('.card');
    card.classList.toggle('hidden-by-me');
    t.classList.toggle('on');
  }
  if(t.classList.contains('hl-btn')){
    var sel=window.getSelection();
    if(!sel||sel.isCollapsed){ alert('先用鼠标选中要划重点的文字，再点 ✎ 哦～'); return; }
    try{
      var range=sel.getRangeAt(0);
      var mark=document.createElement('mark');
      mark.className='hl '+hlColors[hlIdx%3]; hlIdx++;
      range.surroundContents(mark);
      sel.removeAllRanges();
    }catch(err){
      var qt=t.closest('.card').querySelector('.q-text');
      qt.classList.toggle('hl');
    }
  }
});

/* ================ 展开/收起解析 ================ */
var expanded=false;
$('#btnExpand').onclick=function(){
  expanded=!expanded;
  var list=$$('details.ref');
  for(var i=0;i<list.length;i++){ list[i].open=expanded; }
  $('#btnExpand').textContent=expanded?'📕 收起全部解析':'📖 全部展开解析';
};

/* ================ 搜索过滤 ================ */
$('#search').addEventListener('input',function(e){
  var kw=e.target.value.trim().toLowerCase();
  var any=false;
  var cards=$$('.card');
  for(var i=0;i<cards.length;i++){
    var hit=!kw||cards[i].getAttribute('data-search').indexOf(kw)>=0;
    cards[i].style.display=hit?'':'none';
    if(hit)any=true;
  }
  var groups=$$('.group');
  for(var j=0;j<groups.length;j++){
    var cs=groups[j].querySelectorAll('.card'), vis=false;
    for(var k=0;k<cs.length;k++){ if(cs[k].style.display!=='none'){ vis=true; break; } }
    groups[j].style.display=vis?'':'none';
  }
  $('#empty').style.display=any?'none':'block';
});

/* ================ 打卡 ================ */
function pad(n){ return (n<10?'0':'')+n; }
function keyOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayStr(){ return keyOf(new Date()); }
function buildCheck(){
  var done=store.get('checkins',[]);
  var grid=$('#checkGrid'); grid.innerHTML='';
  var today=new Date();
  for(var i=27;i>=0;i--){
    var d=new Date(today); d.setDate(today.getDate()-i);
    var key=keyOf(d);
    var cell=document.createElement('div');
    cell.className='day'+((done.indexOf(key)>=0)?' done':'')+((key===todayStr())?' today':'');
    cell.textContent=d.getDate(); cell.title=key;
    cell.setAttribute('data-key',key);
    cell.onclick=function(){
      var k=this.getAttribute('data-key');
      var arr=store.get('checkins',[]);
      var idx=arr.indexOf(k);
      if(idx>=0){ arr.splice(idx,1); } else { arr.push(k); }
      store.set('checkins',arr); buildCheck();
    };
    grid.appendChild(cell);
  }
  $('#doneCount').textContent=done.length;
}
$('#btnCheck').onclick=function(){ buildCheck(); $('#checkModal').classList.add('show'); };
$('#btnCloseModal').onclick=function(){ $('#checkModal').classList.remove('show'); };
$('#checkModal').addEventListener('click',function(e){ if(e.target.id==='checkModal'){ e.target.classList.remove('show'); } });

/* ================ 回到顶部 ================ */
$('#fabTop').onclick=function(){ window.scrollTo({top:0,behavior:'smooth'}); };
window.addEventListener('scroll',function(){
  $('#fabTop').style.opacity=(window.scrollY>300)?'1':'0.4';
});
</script>
</body>
